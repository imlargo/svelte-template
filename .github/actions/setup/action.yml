# Shared by every CI job: the same toolchain and a clean install from the
# lockfile, so jobs differ only in the one check they run.
name: Setup
description: Install pnpm, Node and the project's dependencies

inputs:
  browsers:
    description: Also install Chromium, for component tests (Vitest browser mode) and e2e
    default: 'false'

runs:
  using: composite
  steps:
    # The version comes from `packageManager` in package.json.
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash

    - if: inputs.browsers == 'true'
      run: pnpm exec playwright install --with-deps chromium
      shell: bash
