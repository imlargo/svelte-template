# The same three checks AGENTS.md asks for before calling anything done, plus
# the e2e smoke suite. No secrets and no backend: the unit tests mock the
# services, and the e2e suite runs the built worker with auth off.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: the workflow checks code, it never writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Chromium for both the component tests (Vitest browser mode) and e2e.
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm run lint
      - run: pnpm run check
      - run: pnpm run test
      - run: pnpm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
